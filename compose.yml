version: '3.7'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    volumes:
      # Mount to Spring Boot's default config directory (highest priority)
      # Spring Boot searches: ./config/ > ./ > classpath:/config/ > classpath:/
      - ./application.yml:/app/config/application.yml
    depends_on:
