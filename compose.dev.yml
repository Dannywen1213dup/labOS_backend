# Development Docker Compose Configuration
# 
# IMPORTANT: This file uses variables from .env.dev
# Run with: docker compose --env-file .env.dev -f compose.dev.yml [command]
#
# Example commands:
#   docker compose --env-file .env.dev -f compose.dev.yml up
#   docker compose --env-file .env.dev -f compose.dev.yml build
#   docker compose --env-file .env.dev -f compose.dev.yml down
#
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    environment:
      # Spring Boot profile and devtools
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DEVTOOLS_RESTART_ENABLED=${SPRING_DEVTOOLS_RESTART_ENABLED}
      - SPRING_DEVTOOLS_LIVERELOAD_ENABLED=${SPRING_DEVTOOLS_LIVERELOAD_ENABLED}
      # Session configuration
      - SPRING_SESSION_STORE_TYPE=${SPRING_SESSION_STORE_TYPE:-none}
      # Redis configuration
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
      - SPRING_REDIS_DATABASE=${SPRING_REDIS_DATABASE:-1}
      - SPRING_REDIS_TIMEOUT=${SPRING_REDIS_TIMEOUT:-5000}
      - SPRING_REDIS_PASSWORD=${SPRING_REDIS_PASSWORD:-}
      # Database configuration
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      # Server configuration
      - SERVER_PORT=${SERVER_PORT:-8101}
      - SERVER_CONTEXT_PATH=${SERVER_CONTEXT_PATH:-/api}
      # MyBatis configuration
      - MYBATIS_LOG_IMPL=${MYBATIS_LOG_IMPL:-org.apache.ibatis.logging.stdout.StdOutImpl}
      # AWS S3 / MinIO configuration
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT}
      - AWS_S3_PUBLIC_ENDPOINT=${AWS_S3_PUBLIC_ENDPOINT}
      # Flag to enable endpoint replacement for local MinIO (development only)
      - USE_LOCAL_MINIO=${USE_LOCAL_MINIO}
      # API documentation
      - KNIFE4J_ENABLE=${KNIFE4J_ENABLE:-true}
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
      # Mount config file (uses environment variables)
      - ./application.yml:/app/config/application.yml
      # Mount Maven local repository cache (optional, speeds up builds)
      - maven-cache:/root/.m2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8101/api/doc.html || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 90s
    # Keep container running for development
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ../frontEnd_LabOS
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    volumes:
      # Mount frontend source code for hot reload
      - ../frontEnd_LabOS:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT}:8080"
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    stdin_open: true
    tty: true

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - net

  mysql:
    image: mysql:8.0
    restart: always
    env_file:
      - .env.dev
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data-dev/sql:/var/lib/mysql
      - ./sql/create_table.sql:/docker-entrypoint-initdb.d/01-create_table.sql:ro
      - ./sql/create_test_user_dev_only.sql:/docker-entrypoint-initdb.d/02-create_test_user_dev_only.sql:ro
    networks:
      - net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack:latest
    restart: always
    env_file:
      - .env.dev
    ports:
      - "${REDIS_PORT}:6379"
      - "${REDIS_INSIGHT_PORT}:8001"
    volumes:
      - ./data-dev/redis:/data
    networks:
      - net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: always
    env_file:
      - .env.dev
    ports:
      - "${MINIO_API_PORT}:9000"  # MinIO API
      - "${MINIO_CONSOLE_PORT}:9001"  # MinIO Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data-dev/minio:/data
    networks:
      - net
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  net:
    driver: bridge

volumes:
  maven-cache:
  frontend-node-modules:
