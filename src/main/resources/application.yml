# Common configuration file
# @author <a href="https://github.com/Dannywen1213dup">Yifan Wen</a>
# @from <a href="https://www.ai4labos.com/">ai4labOS</a>
spring:
  application:
    name: springboot-init
  # Default dev environment
  profiles:
    active: dev
  # Support swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # Session configuration
  session:
    # todo Uncomment to enable distributed session (Redis must be configured first)
    # store-type: redis
    # 30 days expiration
    timeout: 2592000
  # Database configuration
  # todo Need to replace configuration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/my_db
    username: root
    password: 123456
  # Redis configuration
  # todo Need to replace configuration, then uncomment
#  redis:
#    database: 1
#    host: localhost
#    port: 6379
#    timeout: 5000
#    password: 123456
  # Elasticsearch configuration
  # todo Need to replace configuration, then uncomment
#  elasticsearch:
#    uris: http://localhost:9200
#    username: root
#    password: 123456
  # File upload
  servlet:
    multipart:
      # Size limit
      max-file-size: 10MB
server:
  address: 0.0.0.0
  port: 8101
  servlet:
    context-path: /api
    # Cookie 30 days expiration
    session:
      cookie:
        max-age: 2592000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # Global logical delete entity field name
      logic-delete-value: 1 # Logical deleted value (default is 1)
      logic-not-delete-value: 0 # Logical not deleted value (default is 0)
# WeChat related
wx:
  # WeChat Official Account Platform
  # todo Need to replace configuration
  mp:
    token: xxx
    aesKey: xxx
    appId: xxx
    secret: xxx
    config-storage:
      http-client-type: HttpClient
      key-prefix: wx
      redis:
        host: 127.0.0.1
        port: 6379
      type: Memory
  # WeChat Open Platform
  # todo Need to replace configuration
  open:
    appId: xxx
    appSecret: xxx
# AWS S3 object storage
aws:
  s3:
    accessKey: xxx
    secretKey: xxx
    region: xxx
    bucket: xxx
# API documentation configuration
knife4j:
  enable: true
  openapi:
    title: "API Documentation"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.labOS.backend.controller
