#
# Backend-only Docker Compose (NO frontend)
#
# Usage:
#   docker compose -f compose.backend.yml up -d --build
#   docker compose -f compose.backend.yml logs -f backend
#   docker compose -f compose.backend.yml down
#
# Notes:
# - MySQL init scripts in /docker-entrypoint-initdb.d run ONLY on first startup (empty data dir).
#   To re-run SQL from scratch: `docker compose -f compose.backend.yml down -v` then `up` again.
#
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labos-backend
    restart: unless-stopped
    environment:
      # Server
      SERVER_PORT: "8101"
      SERVER_CONTEXT_PATH: "/api"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      # MySQL (connect to the mysql service, NOT localhost)
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/my_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-20040812}

      # Redis
      SPRING_REDIS_HOST: "redis"
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_DATABASE: "1"

      # MinIO (S3-compatible) - keeps S3 config non-empty to avoid startup failure
      USE_LOCAL_MINIO: "true"
      AWS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-labos}
      AWS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-labos20040812}
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-labos}
      AWS_S3_ENDPOINT: "http://minio:9000"
      # Public endpoint used in presigned URLs (browser-accessible). For server-to-server calls this is not used.
      AWS_S3_PUBLIC_ENDPOINT: "http://localhost:9000"
    volumes:
      # Optional: override config (highest priority). Comment out if you want to use the jar's built-in config.
      - ./application.yml:/app/config/application.yml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8101:8101"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8101/api/doc.html >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - net

  mysql:
    image: mysql:8.0
    container_name: labos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-20040812}
      MYSQL_DATABASE: "my_db"
      TZ: "UTC"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Init SQL (only runs on first initialization)
      - ./sql/create_table.sql:/docker-entrypoint-initdb.d/01-create_table.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD:-20040812} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - net

  redis:
    image: redis/redis-stack:latest
    container_name: labos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - net

  minio:
    image: minio/minio:latest
    container_name: labos-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-labos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-labos20040812}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - net

networks:
  net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  minio-data:



