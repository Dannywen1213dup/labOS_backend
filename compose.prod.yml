# Production Docker Compose Configuration
# 
# IMPORTANT: This file uses variables from .env
# Run with: docker compose --env-file .env -f compose.prod.yml [command]
# Or use: ./docker-compose-prod.sh [command]
#
# Example commands:
#   docker compose --env-file .env -f compose.prod.yml up -d
#   docker compose --env-file .env -f compose.prod.yml build
#   docker compose --env-file .env -f compose.prod.yml down
#
# Production setup:
# - Only nginx exposes ports 80/443 (secure networking)
# - All other services are internal only
# - Uses AWS RDS (MySQL) and AWS S3 (not included in compose)
# - Redis for session management
# - Frontend serves static files (no dev server)

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Spring Boot profile
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      # Session configuration (enable Redis session in production)
      - SPRING_SESSION_STORE_TYPE=${SPRING_SESSION_STORE_TYPE:redis}
      # Redis configuration
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
      - SPRING_REDIS_DATABASE=${SPRING_REDIS_DATABASE}
      - SPRING_REDIS_TIMEOUT=${SPRING_REDIS_TIMEOUT}
      - SPRING_REDIS_PASSWORD=${SPRING_REDIS_PASSWORD}
      # Database configuration (AWS RDS)
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      # Server configuration
      - SERVER_PORT=${SERVER_PORT}
      - SERVER_CONTEXT_PATH=${SERVER_CONTEXT_PATH}
      # MyBatis configuration (use Slf4jImpl in production)
      - MYBATIS_LOG_IMPL=${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}
      # AWS S3 configuration (production uses AWS S3, not MinIO)
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      # Note: endpoint is optional for AWS S3 (uses region-based endpoints)
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT}
      # API documentation (disabled in production)
      - KNIFE4J_ENABLE=${KNIFE4J_ENABLE:false}
    volumes:
      # Mount config file (uses environment variables)
      - ./application.yml:/app/config/application.yml:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8101/api/doc.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontEnd_LabOS
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      # Share static files with nginx
      - frontend-static:/usr/share/nginx/html
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Only nginx exposes ports to host (secure networking)
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount frontend static files from shared volume
      - frontend-static:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - internal

  redis:
    image: redis/redis-stack:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data-prod/redis:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports exposed - internal only

networks:
  internal:
    driver: bridge
    # Internal network - no external access

volumes:
  frontend-static:
    # Volume to share frontend static files between frontend and nginx containers

